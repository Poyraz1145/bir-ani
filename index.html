<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Bir anı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     METNİ DEĞİŞTİRMEK İÇİN aşağıdaki <script> içindeki ICERIK
     bölümünü düzenlemen yeterli. Tasarıma dokunmana gerek yok.
     ============================================================ */
  :root{
    --bg:#f4ede1; --bg2:#ebe0cd; --ink:#2b2420; --soft:#7a6a5c;
    --card:#fffdf8; --accent:#b4553a; --shadow:rgba(60,40,20,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg2)}
  body{
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);min-height:100vh;
    color:var(--ink); font-family:"Lora",Georgia,serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{ /* hafif kağıt dokusu */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Giriş ekranı ---------- */
  #giris{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;padding:24px;text-align:center;z-index:5;transition:opacity .9s ease, visibility .9s;
  }
  #giris.gizle{opacity:0;visibility:hidden}
  .zarf{
    width:min(260px,70vw);aspect-ratio:3/2;position:relative;background:#e8d6b9;border-radius:6px;
    box-shadow:0 18px 40px var(--shadow);animation:sallan 3.2s ease-in-out infinite;
  }
  .zarf::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);background:#dcc5a1;border-radius:6px 6px 0 0}
  .zarf::after{
    content:"";position:absolute;left:50%;top:52%;width:34px;height:34px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 35% 35%,#d0705a,var(--accent) 60%,#8e3d28);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  @keyframes sallan{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-4px)}}
  #giris h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.1}
  #giris p{color:var(--soft);font-size:15px;font-style:italic}
  button.ac{
    font:500 16px "Lora",serif;color:#fff;background:var(--accent);border:0;border-radius:999px;
    padding:14px 34px;cursor:pointer;box-shadow:0 8px 20px rgba(180,85,58,.35);transition:transform .15s;
  }
  button.ac:active{transform:scale(.96)}

  /* ---------- Ana içerik ---------- */
  main{max-width:560px;margin:0 auto;padding:44px 18px 80px;opacity:0;transition:opacity 1s ease .2s}
  main.goster{opacity:1}

  .polaroid{
    background:var(--card);padding:12px 12px 0;width:min(100%,420px);margin:0 auto;
    box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 50px var(--shadow);
    transform:rotate(-2deg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
    will-change:transform;
  }
  .polaroid.bitti{touch-action:auto;cursor:default}
  .cerceve{position:relative}
  .kare{position:relative;overflow:hidden;aspect-ratio:1200/1689;background:#22282b}
  .kare img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
  .kimya{ /* banyo öncesi koyu, bulanık kimyasal tabaka */
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, #3a474c 0%, #262f33 60%, #1c2225 100%);
  }
  .parilti{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);
    transform:translateX(-130%);
  }
  .bitti .parilti{transform:translateX(130%);transition:transform 1.8s ease}
  .alt-yazi{font-family:"Caveat",cursive;font-size:clamp(24px,6.5vw,30px);text-align:center;padding:12px 8px 16px;color:#3b302a;min-height:62px}

  .ipucu{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;
    color:var(--soft);font-size:14.5px;font-style:italic;transition:opacity .8s;min-height:40px;text-align:center;
  }
  .ipucu.gizle{opacity:0}
  .ipucu svg{flex:none;animation:titre 1.1s ease-in-out infinite;transform-origin:50% 80%}
  @keyframes titre{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}

  .mektup{
    display:none;margin-top:46px;background:var(--card);padding:34px 26px 30px;border-radius:3px;position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px rgba(60,40,20,.12);
    background-image:repeating-linear-gradient(transparent 0 31px,rgba(120,100,80,.10) 31px 32px);background-position:0 18px;
  }
  .mektup.acik{display:block}
  .mektup::before{
    content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(-3deg);
    background:rgba(230,215,180,.75);box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .mektup p{font-size:16.5px;line-height:32px;margin-bottom:32px;opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease}
  .mektup p.hitap{font-family:"Caveat",cursive;font-size:27px;font-weight:700;margin-bottom:16px}
  .mektup p.imza{font-family:"Caveat",cursive;font-size:26px;text-align:right;margin:8px 0 0;line-height:1.3;white-space:pre-line}
  .mektup p.gorun{opacity:1;transform:none}

  footer{text-align:center;margin-top:42px;color:var(--soft);font-size:13px;letter-spacing:.06em;opacity:0;transition:opacity 1.2s}
  footer.gorun{opacity:1}
  .kalp{display:inline-block;color:var(--accent);animation:at 1.6s ease-in-out infinite}
  @keyframes at{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
</style>
</head>
<body>

<section id="giris">
  <div class="zarf" aria-hidden="true"></div>
  <h1 id="giris-baslik"></h1>
  <p id="giris-alt"></p>
  <button class="ac" id="ac">Aç</button>
</section>

<main id="icerik" aria-live="polite">
  <div class="polaroid" id="polaroid">
    <div class="cerceve">
      <div class="kare"><img src="foto.jpg" alt=""><div class="kimya"></div><div class="parilti"></div></div>
    </div>
    <div class="alt-yazi" id="alt-yazi"></div>
  </div>

  <div class="ipucu" id="ipucu">
    <svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><rect x="2" y="1.5" width="18" height="27" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="11" cy="24" r="1.4" fill="currentColor"/></svg>
    <span id="ipucu-yazi"></span>
  </div>

  <article class="mektup" id="mektup"></article>
  <footer id="son"></footer>
</main>

<script>
/* ==================== DÜZENLENECEK KISIM ==================== */
const ICERIK = {
  girisBaslik: "Size küçük bir sürpriz",
  girisAlt:    "Hazır olduğunuzda açın.",
  fotografAltYazisi: "",           // örn: "1990'lar" — boş bırakabilirsin
  hitap: "Kıymetli Yöneticim Ali Bey,",
  paragraflar: [
    "Bazı insanlar iş hayatında yalnızca bir yönetici olarak kalır. Bazıları ise insanın nasıl çalıştığını, nasıl düşündüğünü, hatta nasıl biri olmak istediğini değiştirir. Siz benim için ikincilerdensiniz.",
    "Bana güvendiğiniz, sorularıma sabırla cevap verdiğiniz ve hata yapıp öğrenmem için alan açtığınız için teşekkür ederim. Sizden öğrendiklerimin çoğu bir raporda ya da sunumda görünmüyor; ama her gün işimin içinde onları taşıyorum.",
    "Bu fotoğrafın size güzel bir anıyı hatırlatacağını düşündüm. Her baktığınızda yüzünüzde küçük bir gülümseme bırakmasını dilerim.",
    "İyi ki yollarımız kesişti."
  ],
  imza: "Sevgi ve saygıyla,\nBerke",
  sonNot: "bir gün okutulmak üzere saklandı",
  ipucuSalla:  "Fotoğrafı banyo etmek için telefonu sallayın",
  ipucuDokun:  "Fotoğrafı banyo etmek için üzerine dokunup sallayın",
  ipucuYarim:  "Güzel, biraz daha…",
  ipucuSon:    "Neredeyse…"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
$("giris-baslik").textContent = ICERIK.girisBaslik;
$("giris-alt").textContent = ICERIK.girisAlt;
$("son").innerHTML = ICERIK.sonNot + ' <span class="kalp">♥</span>';

const mektup = $("mektup");
const satirlar = [
  [ICERIK.hitap, "hitap"], ...ICERIK.paragraflar.map(t => [t, ""]), [ICERIK.imza, "imza"]
].map(([t, c]) => { const p = document.createElement("p"); if (c) p.className = c; p.textContent = t; mektup.appendChild(p); return p; });

const polaroid = $("polaroid");
const resimler = [...document.querySelectorAll(".kare img")];
const kimyalar = [...document.querySelectorAll(".kimya")];
const ipucuYazi = $("ipucu-yazi");

/* ---------- Banyo durumu ---------- */
let p = 0, hedef = 0, bitti = false, basladi = false, sonZaman = 0, hareketVar = false;
const KENDILIGINDEN = 0.0045;   // sallanmasa da çok yavaş gelişir (takılı kalmasın)
const SALLAMA_ADIMI = 0.06;     // her sallamada ilerleme (~17 sallama)

function gorunum(){
  const e = Math.pow(p, 0.85), k = 1 - e;
  const f = `blur(${(k * 5).toFixed(2)}px) saturate(${(0.05 + 0.95 * e).toFixed(3)}) contrast(${(0.5 + 0.5 * e).toFixed(3)}) ` +
            `brightness(${(0.7 + 0.3 * e).toFixed(3)}) sepia(${(k * 0.6).toFixed(3)}) hue-rotate(${(k * 160).toFixed(1)}deg)`;
  resimler.forEach(im => im.style.filter = f);
  const o = Math.pow(1 - p, 1.6).toFixed(3);
  kimyalar.forEach(kd => kd.style.opacity = o);
}
gorunum();

function dongu(t){
  const dt = sonZaman ? Math.min(0.05, (t - sonZaman) / 1000) : 0;
  sonZaman = t;
  if (basladi && !bitti){
    hedef = Math.min(1, hedef + KENDILIGINDEN * dt);
    p += (hedef - p) * Math.min(1, dt * 2.2);
    if (hedef >= 1 && p > 0.995) { p = 1; bitir(); }
    gorunum();
    if (!bitti){
      ipucuYazi.textContent = p > 0.8 ? ICERIK.ipucuSon : p > 0.45 ? ICERIK.ipucuYarim
        : (hareketVar ? ICERIK.ipucuSalla : ICERIK.ipucuDokun);
    }
  }
  if (!bitti) requestAnimationFrame(dongu);
}

function salla(guc = 1){
  if (!basladi || bitti) return;
  hedef = Math.min(1, hedef + SALLAMA_ADIMI * guc);
  const a = (Math.random() * 6 + 3) * (Math.random() < .5 ? -1 : 1);
  polaroid.animate([
    { transform: "rotate(-2deg)" },
    { transform: `rotate(${-2 + a}deg) translateX(${a}px)` },
    { transform: `rotate(${-2 - a * .6}deg) translateX(${-a * .6}px)` },
    { transform: "rotate(-2deg)" }
  ], { duration: 320, easing: "ease-out" });
  if (navigator.vibrate) navigator.vibrate(12);
}

/* ---------- Telefon sallama (ivmeölçer) ---------- */
let onceki = null, sonSallama = 0;
function hareket(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  hareketVar = true;
  if (onceki){
    const d = Math.abs(a.x - onceki.x) + Math.abs(a.y - onceki.y) + Math.abs(a.z - onceki.z);
    const simdi = performance.now();
    if (d > 13 && simdi - sonSallama > 150){ sonSallama = simdi; salla(Math.min(1.6, d / 20)); }
  }
  onceki = { x: a.x, y: a.y, z: a.z };
}

/* ---------- Yedek: fotoğrafa dokunup sürükleyerek sallama ---------- */
let surukle = null, birikim = 0;
polaroid.addEventListener("pointerdown", e => { surukle = { x: e.clientX, y: e.clientY }; birikim = 0; salla(0.5); });
window.addEventListener("pointermove", e => {
  if (!surukle) return;
  birikim += Math.hypot(e.clientX - surukle.x, e.clientY - surukle.y);
  surukle = { x: e.clientX, y: e.clientY };
  if (birikim > 70){ birikim = 0; salla(1); }
});
["pointerup","pointercancel"].forEach(t => window.addEventListener(t, () => surukle = null));

function bitir(){
  if (bitti) return;
  bitti = true;
  resimler.forEach(im => im.style.filter = "none");
  kimyalar.forEach(kd => kd.style.opacity = 0);
  polaroid.classList.add("bitti");
  $("ipucu").classList.add("gizle");
  window.removeEventListener("devicemotion", hareket);
  if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
  setTimeout(() => {
    $("alt-yazi").textContent = ICERIK.fotografAltYazisi;
    mektup.classList.add("acik");
    satirlar.forEach((el, i) => setTimeout(() => {
      el.classList.add("gorun");
      if (i === 1) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 300 + i * 1600));
    setTimeout(() => $("son").classList.add("gorun"), 300 + satirlar.length * 1600);
  }, 1600);
}

/* ---------- Aç ---------- */
$("ac").addEventListener("click", () => {
  // iOS izin penceresi doğrudan dokunma anında istenmeli
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
    DeviceMotionEvent.requestPermission()
      .then(s => { if (s === "granted") window.addEventListener("devicemotion", hareket); })
      .catch(() => {});
  } else {
    window.addEventListener("devicemotion", hareket);
  }
  $("giris").classList.add("gizle");
  $("icerik").classList.add("goster");
  setTimeout(() => { basladi = true; requestAnimationFrame(dongu); }, 700);
}, { once: true });
</script>
</body>
</html>
