<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Bir anı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     METNİ DEĞİŞTİRMEK İÇİN aşağıdaki <script> içindeki ICERIK
     bölümünü düzenlemen yeterli. Tasarıma dokunmana gerek yok.
     ============================================================ */
  :root{
    --bg:#f4ede1; --bg2:#ebe0cd; --ink:#2b2420; --soft:#7a6a5c;
    --card:#fffdf8; --accent:#b4553a; --shadow:rgba(60,40,20,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg2)}
  body{
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);min-height:100vh;
    color:var(--ink); font-family:"Lora",Georgia,serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{ /* hafif kağıt dokusu */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Giriş ekranı ---------- */
  #giris{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:28px;padding:24px;text-align:center;z-index:5;transition:opacity .9s ease, visibility .9s;
  }
  #giris.gizle{opacity:0;visibility:hidden}
  .zarf{
    width:min(260px,70vw);aspect-ratio:3/2;position:relative;background:#e8d6b9;border-radius:6px;
    box-shadow:0 18px 40px var(--shadow);animation:sallan 3.2s ease-in-out infinite;
  }
  .zarf::before{ /* kapak */
    content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);background:#dcc5a1;border-radius:6px 6px 0 0;
  }
  .zarf::after{ /* mühür */
    content:"";position:absolute;left:50%;top:52%;width:34px;height:34px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 35% 35%,#d0705a,var(--accent) 60%,#8e3d28);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  @keyframes sallan{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-4px)}}
  #giris h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.1}
  #giris p{color:var(--soft);font-size:15px;font-style:italic}
  button.ac{
    font:500 16px "Lora",serif;color:#fff;background:var(--accent);border:0;border-radius:999px;
    padding:14px 34px;cursor:pointer;box-shadow:0 8px 20px rgba(180,85,58,.35);transition:transform .15s;
  }
  button.ac:active{transform:scale(.96)}

  /* ---------- Ana içerik ---------- */
  main{max-width:560px;margin:0 auto;padding:48px 20px 80px;opacity:0;transition:opacity 1s ease .2s}
  main.goster{opacity:1}

  .polaroid{
    background:var(--card);padding:14px 14px 0;width:min(100%,420px);margin:0 auto;
    box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 50px var(--shadow);
    transform:rotate(-2.2deg) translateY(30px) scale(.94);opacity:0;
    transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity .8s ease;
  }
  main.goster .polaroid{transform:rotate(-2.2deg) translateY(0) scale(1);opacity:1}
  .cerceve{position:relative;overflow:hidden;aspect-ratio:1420/2000;background:#1d1a17}
  .cerceve img{
    width:100%;height:100%;object-fit:cover;display:block;
    /* banyo efekti: başta karanlık ve renksiz */
    filter:brightness(.05) sepia(1) contrast(.6) blur(6px);opacity:.9;
    transition:filter 7s cubic-bezier(.3,.1,.2,1),opacity 7s ease;
  }
  .cerceve.banyo img{filter:none;opacity:1}
  .cerceve::after{ /* parlama */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);
    transform:translateX(-120%);transition:transform 2.2s ease 6.5s;
  }
  .cerceve.banyo::after{transform:translateX(120%)}
  .alt-yazi{
    font-family:"Caveat",cursive;font-size:clamp(24px,6.5vw,30px);text-align:center;
    padding:14px 8px 18px;color:#3b302a;min-height:68px;
  }
  .ipucu{text-align:center;color:var(--soft);font-size:13px;font-style:italic;margin-top:18px;transition:opacity .8s}
  .ipucu.gizle{opacity:0}

  .mektup{
    margin-top:46px;background:var(--card);padding:34px 28px 30px;border-radius:3px;position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 14px 34px rgba(60,40,20,.12);
    background-image:repeating-linear-gradient(transparent 0 31px,rgba(120,100,80,.10) 31px 32px);
    background-position:0 18px;
  }
  .mektup::before{ /* bant */
    content:"";position:absolute;top:-12px;left:50%;width:110px;height:26px;transform:translateX(-50%) rotate(-3deg);
    background:rgba(230,215,180,.75);box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .mektup p{
    font-size:16.5px;line-height:32px;margin-bottom:32px;
    opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease;
  }
  .mektup p.hitap{font-family:"Caveat",cursive;font-size:27px;font-weight:700;margin-bottom:16px}
  .mektup p.imza{font-family:"Caveat",cursive;font-size:26px;text-align:right;margin:8px 0 0;line-height:1.3;white-space:pre-line}
  .mektup p.gorun{opacity:1;transform:none}
  .mektup{display:none}
  .mektup.acik{display:block}

  footer{text-align:center;margin-top:42px;color:var(--soft);font-size:13px;letter-spacing:.06em;opacity:0;transition:opacity 1.2s}
  footer.gorun{opacity:1}
  .kalp{display:inline-block;color:var(--accent);animation:at 1.6s ease-in-out infinite}
  @keyframes at{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
  }
</style>
</head>
<body>

<section id="giris">
  <div class="zarf" aria-hidden="true"></div>
  <h1 id="giris-baslik"></h1>
  <p id="giris-alt"></p>
  <button class="ac" id="ac">Aç</button>
</section>

<main id="icerik" aria-live="polite">
  <div class="polaroid">
    <div class="cerceve" id="cerceve">
      <img src="foto.jpg" alt="Bir anı fotoğrafı">
    </div>
    <div class="alt-yazi" id="alt-yazi"></div>
  </div>
  <p class="ipucu" id="ipucu">Fotoğraf banyo oluyor…</p>

  <article class="mektup" id="mektup"></article>

  <footer id="son"></footer>
</main>

<script>
/* ==================== DÜZENLENECEK KISIM ==================== */
const ICERIK = {
  girisBaslik: "Size küçük bir sürpriz",
  girisAlt:    "Acele etmeyin, birkaç saniye sürecek.",
  fotografAltYazisi: "",           // örn: "1990'lar" — boş bırakabilirsin
  hitap: "Sevgili [İsim],",
  paragraflar: [
    "Bazı insanlar iş hayatında yalnızca bir yönetici olarak kalır. Bazıları ise insanın nasıl çalıştığını, nasıl düşündüğünü, hatta nasıl biri olmak istediğini değiştirir. Siz benim için ikincilerdensiniz.",
    "Bana güvendiğiniz, sorularıma sabırla cevap verdiğiniz ve hata yapıp öğrenmem için alan açtığınız için teşekkür ederim. Sizden öğrendiklerimin çoğu bir raporda ya da sunumda görünmüyor; ama her gün işimin içinde onları taşıyorum.",
    "Bu fotoğrafın size güzel bir anıyı hatırlatacağını düşündüm. Her baktığınızda yüzünüzde küçük bir gülümseme bırakmasını dilerim.",
    "İyi ki yollarımız kesişti."
  ],
  imza: "Sevgi ve saygıyla,\nBerke",
  sonNot: "bir gün okutulmak üzere saklandı"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
$("giris-baslik").textContent = ICERIK.girisBaslik;
$("giris-alt").textContent = ICERIK.girisAlt;

const mektup = $("mektup");
function ekle(metin, sinif){
  const p = document.createElement("p");
  if (sinif) p.className = sinif;
  p.textContent = metin;
  mektup.appendChild(p);
  return p;
}
const satirlar = [ekle(ICERIK.hitap,"hitap"), ...ICERIK.paragraflar.map(t=>ekle(t)), ekle(ICERIK.imza,"imza")];
$("son").innerHTML = ICERIK.sonNot + ' <span class="kalp">♥</span>';

const img = document.querySelector(".cerceve img");
const resimHazir = new Promise(r => img.complete ? r() : (img.onload = img.onerror = r));

$("ac").addEventListener("click", async () => {
  $("giris").classList.add("gizle");
  $("icerik").classList.add("goster");
  await resimHazir;
  setTimeout(() => $("cerceve").classList.add("banyo"), 900);

  setTimeout(() => {
    $("ipucu").classList.add("gizle");
    $("alt-yazi").textContent = ICERIK.fotografAltYazisi;
    mektup.classList.add("acik");
    satirlar.forEach((p,i) => setTimeout(() => {
      p.classList.add("gorun");
      if (i === 1) p.scrollIntoView({behavior:"smooth", block:"center"});
    }, 400 + i*1600));
    setTimeout(() => $("son").classList.add("gorun"), 400 + satirlar.length*1600);
  }, 8200);
}, {once:true});
</script>
</body>
</html>
